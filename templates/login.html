<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Magazzino OMG</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 400px;
            margin: 60px auto;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-main);
        }
        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }
        h2 { text-align: center; color: var(--primary); margin-top: 0; }
        .flash {
            background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; text-align: center;
        }
        .flash-success { background: #dcfce7; color: #166534; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        input, button { width: 100%; padding: 12px; margin-bottom: 14px; border: 1px solid var(--border-color); border-radius: 10px; box-sizing: border-box; font-size: 1rem; }
        button { background: var(--primary); color: white; border: none; font-weight: 600; cursor: pointer; }
        button:hover { background: var(--primary-hover); }
        .link-reg { text-align: center; display: block; margin-top: 10px; color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .link-reg:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ Magazzino OMG</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Accedi con il tuo account</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {% if category == 'success' %}flash-success{% endif %}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Il tuo nome utente">

            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">

            <button type="submit">Accedi</button>
        </form>

        <a href="{{ url_for('registra') }}" class="link-reg">Non hai un account? Registrati</a>
    </div>
</body>
</html>
