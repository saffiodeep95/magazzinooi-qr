[14:54, 05/11/2026] Marco Pavan: <!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambi Serie - Gestionale OMG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

    <!-- Navbar Principale -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                <i class="fas fa-industry me-2 text-warning"></i>Gestionale OMG
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}"><i class="fas fa-boxes me-1"></i> Magazzino</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('magazzino_pesante') }}"><i class="fas fa-weight-hanging me-1"></i> Pesante</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('nastri') }}"><i class="fas fa-tape me-1"></i> Nastri</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('richieste_manutenzione') }}"><i class="fas fa-tools me-1"></i> Manutenzioni</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('cambi_serie') }}"><i class="fas fa-sync me-1"></i> Cambi Serie</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('promemoria') }}"><i class="fas fa-sticky-note me-1"></i> Promemoria</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('agenda') }}"><i class="fas fa-calendar-alt me-1"></i> Agenda</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('fornitori') }}"><i class="fas fa-truck me-1"></i> Fornitori</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('documenti') }}"><i class="fas fa-folder me-1"></i> Documenti</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('report_ore') }}"><i class="fas fa-chart-line me-1"></i> Report Ore</a></li>
                </ul>
                <div class="d-flex align-items-center text-white">
                    <span class="me-3 small"><i class="fas fa-user-circle me-1"></i>{{ session.get('username') }}</span>
                    {% if session.get('is_admin') %}
                        <a href="{{ url_for('admin_utenti') }}" class="btn btn-outline-warning btn-sm me-2"><i class="fas fa-user-shield me-1"></i> Admin</a>
                    {% endif %}
                    <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm"><i class="fas fa-sign-out-alt me-1"></i> Esci</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenuto Principale -->
    <div class="container my-4">

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Intestazione Pagina -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <div>
                <h2 class="fw-bold text-dark mb-0"><i class="fas fa-sync me-2 text-primary"></i>Registro Cambi Serie</h2>
                <p class="text-muted small mb-0">Gestione e tracciamento dello storico cambi serie e lavorazioni forni.</p>
            </div>
            <div class="d-flex gap-2">
                <a href="{{ url_for('esporta_cambi_serie_csv') }}" class="btn btn-outline-success btn-sm fw-semibold shadow-sm">
                    <i class="fas fa-file-csv me-1"></i> Esporta CSV
                </a>
                <button class="btn btn-primary btn-sm fw-semibold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalNuovoCambioSerie">
                    <i class="fas fa-plus me-1"></i> Nuovo Cambio Serie
                </button>
            </div>
        </div>

        <!-- Filtri di ricerca -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body bg-light rounded">
                <form action="{{ url_for('cambi_serie') }}" method="GET" class="row g-3 align-items-center">
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-muted">Filtra per Forno</label>
                        <select name="forno" class="form-select form-select-sm" onchange="this.form.submit()">
                            <option value="Tutti" {% if forno_filtro == 'Tutti' %}selected{% endif %}>Tutti i forni</option>
                            <option value="F1" {% if forno_filtro == 'F1' %}selected{% endif %}>Forno 1 (F1)</option>
                            <option value="F2" {% if forno_filtro == 'F2' %}selected{% endif %}>Forno 2 (F2)</option>
                            <option value="F3" {% if forno_filtro == 'F3' %}selected{% endif %}>Forno 3 (F3)</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-muted">Filtra per Settimana</label>
                        <input type="week" name="settimana" class="form-control form-control-sm" value="{{ settimana_filtro }}" onchange="this.form.submit()">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <a href="{{ url_for('cambi_serie') }}" class="btn btn-secondary btn-sm me-2">Reset Filtri</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabella Elenco Cambi Serie -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Data Cambio</th>
                                <th>Forno / Linea</th>
                                <th>Bottiglia Smontante</th>
                                <th>Bottiglia Montante</th>
                                <th>Tempo</th>
                                <th>Bottiglie Tempera</th>
                                <th>Misura Piastrina</th>
                                <th class="text-center">Azioni</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% if record_serie %}
                                {% for r in record_serie %}
                                <tr>
                                    <td><span class="fw-bold">{{ r.data_cambio }}</span></td>
                                    <td>
                                        <span class="badge bg-dark">{{ r.forno }}</span>
                                        <span class="badge bg-secondary">Linea {{ r.linea }}</span>
                                    </td>
                                    <td>{{ r.bottiglia_precedente or r.nome_bottiglia or '-' }}</td>
                                    <td><strong class="text-primary">{{ r.bottiglia_nuova or '-' }}</strong></td>
                                    <td><small class="text-muted">{{ r.tempo_cambio or '-' }}</small></td>
                                    <td>
                                        <span class="badge bg-light text-dark border">
                                            Vecchia: {{ r.num_bottiglie_tempera_vecchia or 0 }} | Nuova: {{ r.num_bottiglie_tempera_nuova if r.num_bottiglie_tempera_nuova is not none else r.num_bottiglie_tempera or 0 }}
                                        </span>
                                    </td>
                                    <td><span class="badge bg-info text-dark">{{ r.misura_piastrina or 'Non indicata' }}</span></td>
                                    <td class="text-center">
                                        <form action="{{ url_for('elimina_cambio_serie', id_cambio=r.id) }}" method="POST" class="d-inline" onsubmit="return confirm('Vuoi eliminare questo record?');">
                                            <button type="submit" class="btn btn-outline-danger btn-sm py-0 px-2" title="Elimina"><i class="fas fa-trash-alt"></i></button>
                                        </form>
                                    </td>
                                </tr>
                                {% endfor %}
                            {% else %}
                                <tr>
                                    <td colspan="8" class="text-center py-4 text-muted">Nessun cambio serie registrato per i filtri selezionati.</td>
                                </tr>
                            {% endif %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Modale Nuovo Cambio Serie (Senza Obbligo Piastrina) -->
    <div class="modal fade" id="modalNuovoCambioSerie" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <form action="{{ url_for('aggiungi_cambio_serie') }}" method="POST">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title fw-bold fs-6"><i class="fas fa-sync me-2 text-warning"></i>Registra Cambio Serie</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Forno *</label>
                                <select class="form-select form-select-sm" name="forno" id="select_forno" required onchange="caricaUltimaBottiglia()">
                                    <option value="">Seleziona...</option>
                                    <option value="F1">Forno 1 (F1)</option>
                                    <option value="F2">Forno 2 (F2)</option>
                                    <option value="F3">Forno 3 (F3)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Linea *</label>
                                <input type="text" class="form-control form-control-sm" name="linea" id="input_linea" required placeholder="Es. 12" onchange="caricaUltimaBottiglia()">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Data Cambio *</label>
                            <input type="date" class="form-control form-control-sm" name="data_cambio" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Bottiglia Smontante (Precedente)</label>
                            <input type="text" class="form-control form-control-sm" name="bottiglia_precedente" id="input_bottiglia_precedente" placeholder="Autocompilata da ultimo cambio...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Bottiglia Montante (Nuova) *</label>
                            <input type="text" class="form-control form-control-sm" name="bottiglia_nuova" required placeholder="Es. Borgogno 75cl">
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">N° Bottiglie Tempera (Vecchia)</label>
                                <input type="number" class="form-control form-control-sm" name="num_bottiglie_tempera_vecchia" id="input_tempera_vecchia" value="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">N° Bottiglie Tempera (Nuova)</label>
                                <input type="number" class="form-control form-control-sm" name="num_bottiglie_tempera_nuova" value="0">
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Tempo Cambio</label>
                                <input type="text" class="form-control form-control-sm" name="tempo_cambio" placeholder="Es. 2 ore 30 min">
                            </div>
                            <!-- Campo Piastrina NON OBBLIGATORIO -->
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Misura Piastrina (Opzionale)</label>
                                <input type="text" class="form-control form-control-sm" name="misura_piastrina" placeholder="Es. 12mm (opzionale)">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Annulla</button>
                        <button type="submit" class="btn btn-primary btn-sm fw-semibold">Salva Cambio Serie</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function caricaUltimaBottiglia() {
            const forno = document.getElementById('select_forno').value;
            const linea = document.getElementById('input_linea').value;
            if (forno && linea) {
                fetch(/api/ultima_bottiglia/${forno}/${linea})
                    .then(res => res.json())
                    .then(data => {
                        if (data.bottiglia) {
                            document.getElementById('input_bottiglia_precedente').value = data.bottiglia;
                        }
                        if (data.tempera !== undefined) {
                            document.getElementById('input_tempera_vecchia').value = data.tempera;
                        }
                    })
                    .catch(err => console.error("Errore recupero ultima bottiglia:", err));
            }
        }
    </script>
</body>
</html>
