<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - Magazzino</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f8fafc; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; width: 100%; max-width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .btn { background: #10b981; color: white; width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }
        .flash { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 0.85rem; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align: center; margin-top: 0;">📝 Registrazione</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="Scegli Username" required autocomplete="username">
            <input type="password" name="password" placeholder="Scegli Password" required autocomplete="new-password">
            <button type="submit" class="btn">Registrati</button>
        </form>
        <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
            Hai già un account? <a href="{{ url_for('login') }}" style="color: #4f46e5; text-decoration: none; font-weight: bold;">Accedi</a>
        </p>
    </div>
</body>
</html>
