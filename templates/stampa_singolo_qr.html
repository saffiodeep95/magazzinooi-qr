<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Stampa QR Code - {{ prodotto.nome }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .qr-label { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; }
        }
        .qr-label {
            width: 380px;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 20px;
            margin: 30px auto;
            text-align: center;
            background: #fff;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container text-center my-4 no-print">
        <button onclick="window.print()" class="btn btn-success btn-lg shadow fw-bold">
            <i class="fas fa-print me-2"></i>Stampa Etichetta QR
        </button>
        <a href="{{ url_for('gestisci_prodotto', qr_code=prodotto.qr_code) }}" class="btn btn-secondary btn-lg shadow ms-2 fw-bold">
            <i class="fas fa-arrow-left me-2"></i>Torna alla Scheda
        </a>
    </div>

    <div class="qr-label shadow-sm">
        <h4 class="fw-bold mb-1 text-dark">{{ prodotto.nome }}</h4>
        <p class="text-muted mb-2 small">SAP: {{ prodotto.sap or 'N/D' }}</p>
        
        <!-- QR Code generato via API -->
        <div class="my-3">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=170x170&data={{ prodotto.qr_code }}" alt="QR Code" class="img-fluid">
        </div>

        <h5 class="fw-bold text-dark mb-2">Codice: {{ prodotto.qr_code }}</h5>
        
        <hr class="my-2">
        
        <!-- MATRICOLA E STATO STAMPATI SULL'ETICHETTA -->
        <div class="text-start small px-2">
            <div class="d-flex justify-content-between mb-1">
                <span><strong>Matricola (S/N):</strong></span>
                <span class="text-primary fw-bold">{{ prodotto.matricola or 'Non specificata' }}</span>
            </div>
            <div class="d-flex justify-content-between">
                <span><strong>Stato Pezzo:</strong></span>
                <span class="badge bg-secondary">{{ prodotto.stato_pezzo or 'Nuovo' }}</span>
            </div>
        </div>
    </div>

</body>
</html>
