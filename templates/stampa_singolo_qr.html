<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etichetta - {{ prodotto.nome }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @page { size: auto; margin: 5mm; }
        @media print {
            .no-print { display: none !important; }
            body { background-color: white !important; margin: 0 !important; padding: 0 !important; }
            .etichetta-container {
                border: 2px dashed #000 !important;
                box-shadow: none !important;
                width: 100% !important;
                max-width: 70mm !important;
                margin: 0 auto !important;
                page-break-inside: avoid;
            }
        }
        .etichetta-container {
            max-width: 320px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: #fff;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column align-items-center justify-content-center min-vh-100 py-3">

    <div class="etichetta-container shadow-sm p-3 text-center mx-auto">
        <h5 class="fw-bold text-dark mb-1 text-truncate" title="{{ prodotto.nome }}">{{ prodotto.nome }}</h5>
        <div class="text-muted small mb-2">SAP: <span class="fw-semibold">{{ prodotto.sap if prodotto.sap else '-' }}</span></div>
        
        <div id="qrcode" class="d-flex justify-content-center my-2"></div>
        <div class="font-monospace fw-bold text-dark small mb-2">{{ prodotto.qr_code }}</div>
        
        <hr class="my-2">

        <div class="text-start small px-1">
            <div class="d-flex justify-content-between py-0.5">
                <span class="text-muted">Ubicazione:</span>
                <span class="fw-bold">{{ prodotto.posizione if prodotto.posizione else '-' }}</span>
            </div>
            <div class="d-flex justify-content-between py-0.5">
                <span class="text-muted">Quantità:</span>
                <span class="badge bg-dark text-white">{{ prodotto.quantita }}</span>
            </div>
            <div class="d-flex justify-content-between py-0.5">
                <span class="text-muted">Peso:</span>
                <span>{{ prodotto.peso if prodotto.peso else '-' }}</span>
            </div>
        </div>
    </div>

    <div class="mt-4 no-print text-center">
        <button onclick="window.print()" class="btn btn-primary btn-sm px-4"><i class="fas fa-print"></i> Stampa Etichetta</button>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm px-3 ms-2">Torna alla Dashboard</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            new QRCode(document.getElementById("qrcode"), {
                text: "{{ prodotto.qr_code }}",
                width: 110,
                height: 110,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        });
    </script>
</body>
</html>
