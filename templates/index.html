<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Home - Gestione Magazzino</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="p-5 mb-4 bg-light rounded-3 shadow-sm">
        <div class="container-fluid py-3">
            <h1 class="display-5 fw-bold">Sistema Gestione Manutenzioni & Magazzino</h1>
            <p class="col-md-8 fs-4 text-muted">Benvenuto, <strong>{{ current_user.username }}</strong> (Ruolo: <em>{{ current_user.role }}</em>)</p>
            <hr class="my-4">
            <div class="d-flex gap-3 flex-wrap">
                <a class="btn btn-primary btn-lg" href="{{ url_for('gestione_rulli') }}" role="button">Magazzino & Sezione Pesanti</a>
                <a class="btn btn-secondary btn-lg" href="{{ url_for('manutenzioni') }}" role="button">Registro Manutenzioni</a>
                {% if current_user.role == 'admin' %}
                <a class="btn btn-dark btn-lg" href="{{ url_for('manage_users') }}" role="button">Gestione Utenti & Permessi</a>
                {% endif %}
            </div>
            <div class="mt-4">
                <a href="{{ url_for('logout') }}" class="btn btn-outline-danger">Disconnetti (Logout)</a>
            </div>
        </div>
    </div>
</body>
</html>
