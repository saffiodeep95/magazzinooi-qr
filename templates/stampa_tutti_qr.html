<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stampa QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background: white; color: #1e293b; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .qr-card { border: 1px dashed #cbd5e1; padding: 15px; border-radius: 8px; text-align: center; page-break-inside: avoid; }
        .btn { background: #4f46e5; color: white; padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        @media print {
            .no-print { display: none; }
            body { padding: 0; }
        }
    </style>
</head>
<body>

    <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>🖨️ Stampa Etichette QR Code</h1>
        <div>
            <button onclick="window.print();" class="btn" style="background: #10b981;">Stampa Pagina</button>
            <a href="{{ url_for('index') }}" class="btn" style="background: #64748b;">Torna alla Home</a>
        </div>
    </div>

    <div class="grid">
        {% for p in prodotti %}
        <div class="qr-card">
            <h4 style="margin: 0 0 10px 0; font-size: 0.95rem;">{{ p.nome }}</h4>
            <div class="qrcode-container" id="qr-print-{{ loop.index }}" data-code="{{ p.qr_code }}" style="display: flex; justify-content: center; margin-bottom: 5px;"></div>
            <small style="font-family: monospace; color: #475569;">{{ p.qr_code }}</small>
            {% if p.sap %}<br><small style="color: #64748b;">SAP: {{ p.sap }}</small>{% endif %}
        </div>
        {% endfor %}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll(".qrcode-container").forEach(function(el) {
                let code = el.getAttribute("data-code");
                if(code) {
                    new QRCode(el, {
                        text: code,
                        width: 100,
                        height: 100,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            });
        });
    </script>
</body>
</html>
