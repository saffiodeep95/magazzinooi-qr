<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stampa Massiva QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 5px; background: white; color: black; }
        .no-print { text-align: center; margin-bottom: 10px; padding: 10px; background: #f1f5f9; border-radius: 8px; }
        .btn { background: #4f46e5; color: white; padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        
        /* Griglia compatta per risparmiare carta */
        .grid-qr {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 6px;
            page-break-inside: avoid;
        }
        .qr-item {
            border: 1px dashed #cbd5e1;
            padding: 6px;
            text-align: center;
            border-radius: 4px;
            background: #fff;
            page-break-inside: avoid;
            break-inside: avoid;
        }
        .qr-item h4 {
            margin: 2px 0 4px 0;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .qr-item small {
            font-size: 9px;
            color: #64748b;
            display: block;
            margin-top: 2px;
        }
        .qrcode-box img {
            margin: 0 auto;
            display: block;
        }

        @media print {
            .no-print { display: none; }
            body { padding: 0; }
            .grid-qr { gap: 4px; }
            .qr-item { border: 1px solid #000; padding: 4px; }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <a href="{{ url_for('index') }}" class="btn" style="background: #64748b; margin-right: 10px;">← Torna alla Home</a>
        <button onclick="window.print()" class="btn" style="background: #10b981;">🖨️ Stampa Etichette</button>
    </div>

    <div class="grid-qr">
        {% for p in prodotti %}
        <div class="qr-item">
            <h4>{{ p.nome }}</h4>
            <div class="qrcode-box" id="qr-{{ loop.index }}" data-code="{{ p.qr_code }}"></div>
            <small>{{ p.qr_code }}</small>
        </div>
        {% endfor %}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll(".qrcode-box").forEach(function(el) {
                let code = el.getAttribute("data-code");
                if(code) {
                    new QRCode(el, {
                        text: code,
                        width: 90,
                        height: 90,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            });
        });
    </script>
</body>
</html>
