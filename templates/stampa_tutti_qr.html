<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Stampa Multipla QR Code - Gestionale OMG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .etichetta-multipla {
                border: 1px solid #999 !important;
                page-break-inside: avoid;
            }
        }
        .etichetta-multipla {
            width: 220px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            padding: 10px;
            text-align: center;
            display: inline-block;
            vertical-align: top;
            margin: 8px;
        }
    </style>
</head>
<body class="bg-light py-4">

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 no-print">
            <h3>Stampa Multipla Etichette QR</h3>
            <div>
                <button onclick="window.print()" class="btn btn-primary"><i class="fas fa-print"></i> Stampa Tutte</button>
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Torna al Magazzino</a>
            </div>
        </div>

        <!-- Griglia delle etichette -->
        <div class="text-center">
            {% for p in prodotti %}
            <div class="etichetta-multipla shadow-sm">
                <h6 class="fw-bold text-dark text-truncate mb-1" style="font-size: 0.9rem;" title="{{ p.nome }}">{{ p.nome }}</h6>
                <div class="text-muted" style="font-size: 0.75rem;">SAP: {{ p.sap if p.sap else '-' }}</div>
                
                <div class="qr-box my-2 d-flex justify-content-center" data-qr="{{ p.qr_code }}"></div>
                <div class="font-monospace fw-bold small">{{ p.qr_code }}</div>
                
                <div class="mt-2 pt-1 border-top text-start" style="font-size: 0.75rem;">
                    <div><strong>Ubicazione:</strong> {{ p.posizione if p.posizione else '-' }}</div>
                    <div><strong>Quantità:</strong> <span class="badge bg-secondary">{{ p.quantita }}</span></div>
                </div>
            </div>
            {% else %}
            <p class="text-muted">Nessun articolo disponibile per la stampa.</p>
            {% endfor %}
        </div>
    </div>

    <!-- Script di generazione dinamica per tutti i QR code multipli -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll('.qr-box').forEach(function(el) {
                let code = el.getAttribute('data-qr');
                new QRCode(el, {
                    text: code,
                    width: 90,
                    height: 90,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            });
        });
    </script>
</body>
</html>
