<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stampa QR Code - Risparmio Carta</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; background: white; color: #000; }
        .no-print { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .btn { background: #4f46e5; color: white; padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        
        /* Griglia compatta per risparmiare carta */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            page-break-inside: avoid;
        }
        .qr-card {
            border: 1px dashed #cbd5e1;
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            background: #fff;
            break-inside: avoid;
        }
        .qr-card h4 { font-size: 0.85rem; margin: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .qr-card p { font-size: 0.72rem; margin: 2px 0; color: #475569; }
        
        /* Codice QR selezionabile e copiabile */
        .qr-code-text { 
            font-family: monospace; 
            font-size: 0.75rem; 
            color: #1e293b; 
            font-weight: bold; 
            user-select: all; 
            -webkit-user-select: all; 
            -moz-user-select: all; 
            -ms-user-select: all;
            background: #f1f5f9;
            padding: 2px 4px;
            border-radius: 3px;
            display: inline-block;
            cursor: pointer;
        }
        
        .qrcode-container { display: flex; justify-content: center; margin: 4px 0; }
        .qrcode-container canvas, .qrcode-container img { width: 85px !important; height: 85px !important; }

        @media print {
            .no-print { display: none; }
            body { padding: 0; }
            .grid-container { gap: 6px; }
            .qr-card { border: 1px solid #000; padding: 4px; }
            .qr-code-text { background: none; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>🖨️ Stampa Etichette QR con Posizione</h1>
        <div>
            <button onclick="window.print()" class="btn" style="background: #10b981;">🖨️ Stampa Ora</button>
            <a href="{{ url_for('index') }}" class="btn" style="background: #64748b; margin-left: 10px;">← Torna alla Home</a>
        </div>
    </div>

    <div class="grid-container">
        {% for p in prodotti %}
        <div class="qr-card">
            <h4>{{ p.nome }}</h4>
            <div class="qrcode-container" id="qr-print-{{ loop.index }}" data-code="{{ p.qr_code }}"></div>
            <p><span class="qr-code-text" title="Clicca per selezionare">{{ p.qr_code }}</span></p>
            {% if p.sap %}<p>SAP: {{ p.sap }}</p>{% endif %}
            <p style="font-weight: bold; color: #2563eb; font-size: 0.75rem;">📍 {{ p.posizione if p.posizione else 'Nessuna posizione' }}</p>
        </div>
        {% endfor %}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll(".qrcode-container").forEach(function(el) {
                let code = el.getAttribute("data-code");
                if(code) {
                    new QRCode(el, {
                        text: code,
                        width: 85,
                        height: 85,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            });
        });
    </script>

</body>
</html>
