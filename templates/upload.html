<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload CSV</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f8fafc; color: #1e293b; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn { background: #4f46e5; color: white; padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 15px; }
        input[type="file"] { margin: 20px 0; }
    </style>
</head>
<body>

    <h1>📁 Importa Articoli da CSV</h1>
    <a href="{{ url_for('index') }}" class="btn" style="background: #64748b; margin-bottom: 20px;">← Torna alla Home</a>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div style="background: #dcfce7; color: #166534; padding: 12px; border-radius: 8px; margin-bottom: 15px;">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card">
        <form method="POST" enctype="multipart/form-data">
            <p style="color: #64748b; font-size: 0.9rem;">Formato richiesto per riga CSV: <br><code>QR_CODE, NOME, SAP, QUANTITA, POSIZIONE</code></p>
            <input type="file" name="file_csv" accept=".csv" required><br>
            <button type="submit" class="btn" style="background: #0ea5e9; width: 100%;">Carica e Importa</button>
        </form>
    </div>
</body>
</html>
