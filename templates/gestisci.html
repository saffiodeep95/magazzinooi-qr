<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione - {{ prodotto.nome }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; background: #f8fafc; color: #1e293b; }
        .card { background: #ffffff; padding: 25px; border-radius: 14px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 16px; border: 1px solid #e2e8f0; text-align: center; }
        .btn { background: #4f46e5; color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: 600; border: none; cursor: pointer; display: inline-block; margin: 5px; }
        .btn-danger { background: #ef4444; }
        .btn-success { background: #10b981; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Gestione Articolo</h1>
        <h2>{{ prodotto.nome }}</h2>
        <p><strong>Codice QR:</strong> <code>{{ prodotto.qr_code }}</code></p>
        <p><strong>Codice SAP:</strong> {{ prodotto.sap if prodotto.sap else '-' }}</p>
        <p><strong>Quantità Attuale:</strong> {{ prodotto.quantita }}</p>
        <p><strong>Posizione:</strong> {{ prodotto.posizione if prodotto.posizione else '-' }}</p>

        <!-- QR Code grande per visualizzazione e stampa -->
        <div style="margin: 20px 0;">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data={{ prodotto.qr_code }}" alt="QR Code" style="border: 1px solid #e2e8f0; padding: 10px; background: white; border-radius: 8px;">
        </div>

        <div>
            <button onclick="window.print();" class="btn">🖨️ Stampa QR Code</button>
            <a href="{{ url_for('carico', qr_code=prodotto.qr_code) }}" class="btn btn-success">➕ Carico Rapido</a>
            <a href="{{ url_for('scarico', qr_code=prodotto.qr_code) }}" class="btn btn-danger">➖ Scarico Rapido</a>
        </div>
        
        <div style="margin-top: 20px;">
            <a href="{{ url_for('index') }}" class="btn" style="background: #64748b;">← Torna alla Home</a>
        </div>
    </div>

</body>
</html>
