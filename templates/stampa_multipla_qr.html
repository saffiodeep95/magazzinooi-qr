<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Stampa Etichette QR - Armadio / Scaffale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .card-qr { break-inside: avoid; border: 2px solid #000 !important; box-shadow: none !important; }
        }
        .card-qr {
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 16px;
            background: #fff;
            text-align: center;
            height: 100%;
        }
    </style>
</head>
<body class="bg-light p-4">

    <!-- Barra di stampa (visibile solo a schermo) -->
    <div class="container mb-4 no-print d-flex justify-content-between align-items-center">
        <div>
            <h3 class="mb-0"><i class="fa-solid fa-print me-2"></i>Stampa Etichette QR per Armadio</h3>
            <p class="text-muted small mb-0">Riepilogo essenziale: Nome, Quantità e QR Code</p>
        </div>
        <button onclick="window.print()" class="btn btn-dark btn-lg fw-bold">
            <i class="fa-solid fa-print me-2"></i> Stampa Foglio
        </button>
    </div>

    <!-- Griglia Schede -->
    <div class="container">
        <div class="row row-cols-1 row-cols-md-3 g-3">
            {% for p in prodotti %}
            <div class="col">
                <div class="card-qr shadow-sm d-flex flex-column justify-content-between align-items-center">
                    
                    <!-- Nome Oggetto -->
                    <h5 class="fw-bold text-dark mb-2 text-uppercase">{{ p.nome }}</h5>

                    <!-- QR Code Immagine -->
                    <div class="my-2">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data={{ p.qr_code }}" alt="QR {{ p.qr_code }}" class="img-fluid" style="width: 130px; height: 130px;">
                    </div>

                    <!-- Testo Matricola / QR Code -->
                    <div class="badge bg-secondary font-monospace fs-6 mb-2">
                        {{ p.qr_code }}
                    </div>

                    <!-- Quantità -->
                    <div class="w-100 border-top pt-2 mt-1">
                        <span class="text-muted small fw-bold">QUANTITÀ:</span>
                        <span class="badge {{ 'bg-danger' if p.quantita <= (p.soglia_minima or 3) else 'bg-success' }} fs-6 ms-1">
                            {{ p.quantita }} pz
                        </span>
                    </div>

                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
