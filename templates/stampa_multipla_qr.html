<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionale OMG - Stampa QR Code Selezionati</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @page {
            size: A4;
            margin: 8mm;
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; margin: 0 !important; }
            #areaStampa {
                display: flex !important;
                flex-wrap: wrap !important;
                justify-content: flex-start !important;
                gap: 5mm !important;
            }
            .etichetta-stampa {
                border: 1px dashed #444 !important;
                box-shadow: none !important;
                page-break-inside: avoid !important;
                margin: 0 !important;
                width: 62mm !important;
                padding: 6px !important;
                background: #fff !important;
                text-align: center !important;
            }
        }
        .etichetta-schermo {
            width: 210px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            padding: 10px;
            text-align: center;
            display: inline-block;
            vertical-align: top;
            margin: 6px;
        }
    </style>
</head>
<body class="bg-light py-3">

    <div class="container-fluid px-4 no-print">
        <!-- Barra di Controllo (Schermo) -->
        <div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-white shadow-sm rounded flex-wrap gap-2">
            <h5 class="mb-0 fw-bold text-dark"><i class="fas fa-print me-2 text-primary"></i>Stampa QR Code per Pezzo</h5>
            <div class="d-flex gap-2 flex-wrap">
                <button type="button" class="btn btn-primary btn-sm" onclick="selezionaTutti(true)"><i class="fas fa-check-square me-1"></i> Seleziona Tutti</button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="selezionaTutti(false)"><i class="fas fa-square me-1"></i> Deseleziona Tutti</button>
                <button type="button" class="btn btn-success btn-sm fw-bold" onclick="avviaStampa()"><i class="fas fa-print me-1"></i> Stampa Selezionati</button>
                <a href="{{ url_for('index') }}" class="btn btn-outline-dark btn-sm"><i class="fas fa-home me-1"></i> Home</a>
            </div>
        </div>

        <!-- ELENCO ORDINATO A SCHERMO (UN SOLO BOX PER ARTICOLO) -->
        <div class="text-center">
            {% for p in prodotti %}
            <div class="etichetta-schermo shadow-sm position-relative" id="card-schermo-{{ p.qr_code }}">
                <div class="position-absolute top-0 start-0 m-2">
                    <input class="form-check-input qr-checkbox" type="checkbox" value="{{ p.qr_code }}" data-nome="{{ p.nome }}" data-posizione="{{ p.posizione or '-' }}" data-quantita="{{ p.quantita if p.quantita > 0 else 1 }}" checked style="transform: scale(1.2); cursor: pointer;">
                </div>

                <!-- Nome Articolo per intero -->
                <h6 class="fw-bold text-dark text-wrap text-break mb-2 mt-2 px-1" style="font-size: 0.85rem; line-height: 1.2;">{{ p.nome }}</h6>
                
                <div class="qr-preview my-2 d-flex justify-content-center" data-qr="{{ p.qr_code }}"></div>
                <div class="font-monospace fw-bold text-dark small mb-2">{{ p.qr_code }}</div>
                
                <div class="pt-2 border-top d-flex justify-content-between align-items-center px-1" style="font-size: 0.75rem;">
                    <span class="text-muted">Ubicazione: <strong class="text-dark">{{ p.posizione if p.posizione else '-' }}</strong></span>
                    <span class="badge bg-primary fs-6">{{ p.quantita }} pz</span>
                </div>
            </div>
            {% else %}
            <p class="text-muted">Nessun articolo disponibile per la stampa.</p>
            {% endfor %}
        </div>
    </div>

    <!-- AREA DI STAMPA DINAMICA (GENERATE SOLO IN FASE DI STAMPA) -->
    <div id="areaStampa" class="d-none d-print-flex"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Genera la preview grafica del QR code per la schermata
            document.querySelectorAll('.qr-preview').forEach(function(el) {
                let code = el.getAttribute('data-qr');
                new QRCode(el, {
                    text: code,
                    width: 80,
                    height: 80,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            });
        });

        function selezionaTutti(stato) {
            document.querySelectorAll('.qr-checkbox').forEach(function(cb) {
                cb.checked = stato;
            });
        }

        function avviaStampa() {
            const areaStampa = document.getElementById('areaStampa');
            areaStampa.innerHTML = ''; // Pulisce precedenti etichette di stampa

            const checkboxes = document.querySelectorAll('.qr-checkbox:checked');

            if (checkboxes.length === 0) {
                alert("Seleziona almeno un articolo da stampare!");
                return;
            }

            // Per ogni articolo selezionato, genera N etichette pari al numero di pezzi
            checkboxes.forEach(function(cb) {
                const qrCode = cb.value;
                const nome = cb.getAttribute('data-nome');
                const posizione = cb.getAttribute('data-posizione');
                const quantita = parseInt(cb.getAttribute('data-quantita')) || 1;

                for (let i = 0; i < quantita; i++) {
                    let divEtichetta = document.createElement('div');
                    divEtichetta.className = 'etichetta-stampa';
                    divEtichetta.innerHTML = `
                        <h6 style="font-weight: bold; color: #000; font-size: 0.82rem; line-height: 1.15; word-wrap: break-word; margin-bottom: 4px;">${nome}</h6>
                        <div class="qr-print-box" style="display: flex; justify-content: center; margin: 4px 0;"></div>
                        <div style="font-family: monospace; font-weight: bold; font-size: 0.75rem; color: #000;">${qrCode}</div>
                        <div style="margin-top: 4px; padding-top: 3px; border-top: 1px solid #ccc; font-size: 0.75rem; color: #333;">
                            Ubicazione: <strong>${posizione}</strong>
                        </div>
                    `;
                    areaStampa.appendChild(divEtichetta);

                    // Genera subito il codice QR grafico nella nuova etichetta
                    let qrBox = divEtichetta.querySelector('.qr-print-box');
                    new QRCode(qrBox, {
                        text: qrCode,
                        width: 75,
                        height: 75,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            });

            // Avvia la stampa
            setTimeout(function() {
                window.print();
            }, 300);
        }
    </script>
</body>
</html>
