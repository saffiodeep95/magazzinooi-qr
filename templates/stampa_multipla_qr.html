<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionale OMG - Stampa QR Code Selezionati</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .etichetta-multipla {
                border: 1px solid #999 !important;
                page-break-inside: avoid;
            }
            .etichetta-multipla input[type="checkbox"] {
                display: none !important;
            }
        }
        .etichetta-multipla {
            width: 210px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            padding: 10px;
            text-align: center;
            display: inline-block;
            vertical-align: top;
            margin: 8px;
        }
    </style>
</head>
<body class="bg-light py-4">

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white shadow-sm rounded no-print flex-wrap gap-2">
            <h4 class="mb-0"><i class="fas fa-print me-2"></i>Stampa QR Code</h4>
            <div class="d-flex gap-2 flex-wrap">
                <button type="button" class="btn btn-primary btn-sm" onclick="selezionaTutti(true)"><i class="fas fa-check-square me-1"></i> Seleziona Tutti</button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="selezionaTutti(false)"><i class="fas fa-square me-1"></i> Deseleziona Tutti</button>
                <button type="button" class="btn btn-success btn-sm" onclick="stampaSelezionati()"><i class="fas fa-print me-1"></i> Stampa Selezionati</button>
                <a href="{{ url_for('index') }}" class="btn btn-outline-dark btn-sm"><i class="fas fa-home me-1"></i> Home</a>
            </div>
        </div>

        <div class="text-center">
            {% for p in prodotti %}
            <div class="etichetta-multipla shadow-sm position-relative">
                <div class="position-absolute top-0 start-0 m-2 no-print">
                    <input class="form-check-input qr-checkbox" type="checkbox" value="{{ p.qr_code }}" checked style="transform: scale(1.2);">
                </div>

                <h6 class="fw-bold text-dark text-truncate mb-1 mt-2 px-3" style="font-size: 0.9rem;" title="{{ p.nome }}">{{ p.nome }}</h6>
                <div class="text-muted" style="font-size: 0.75rem;">SAP: {{ p.sap if p.sap else '-' }}</div>
                
                <div class="qr-box my-2 d-flex justify-content-center" data-qr="{{ p.qr_code }}"></div>
                <div class="font-monospace fw-bold small">{{ p.qr_code }}</div>
                
                <div class="mt-2 pt-1 border-top text-start" style="font-size: 0.75rem;">
                    <div><strong>Ubicazione:</strong> {{ p.posizione if p.posizione else '-' }}</div>
                    <div><strong>Quantità:</strong> <span class="badge bg-secondary">{{ p.quantita }}</span></div>
                </div>
            </div>
            {% else %}
            <p class="text-muted">Nessun articolo disponibile per la stampa.</p>
            {% endfor %}
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll('.qr-box').forEach(function(el) {
                let code = el.getAttribute('data-qr');
                new QRCode(el, {
                    text: code,
                    width: 85,
                    height: 85,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            });
        });

        function selezionaTutti(stato) {
            document.querySelectorAll('.qr-checkbox').forEach(function(cb) {
                cb.checked = stato;
            });
        }

        function stampaSelezionati() {
            document.querySelectorAll('.etichetta-multipla').forEach(function(card) {
                let cb = card.querySelector('.qr-checkbox');
                if (cb && !cb.checked) {
                    card.style.display = 'none';
                } else {
                    card.style.display = 'inline-block';
                }
            });

            window.print();

            setTimeout(function() {
                document.querySelectorAll('.etichetta-multipla').forEach(function(card) {
                    card.style.display = 'inline-block';
                });
            }, 500);
        }
    </script>
</body>
</html>
