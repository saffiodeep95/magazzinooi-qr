<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Stampa QR Multipli</title>
    <style>
        /* Stili CSS per la griglia di stampa */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .qr-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .qr-card {
            border: 1px solid #ccc;
            padding: 15px;
            width: 200px;
            text-align: center;
            page-break-inside: avoid;
        }
        @media print {
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="no-print" style="margin-bottom: 20px;">
        <button onclick="window.print()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">🖨️ Stampa</button>
    </div>

    <div class="qr-grid">
        <!-- Ciclo che scorre i prodotti passati da app.py -->
        {% for p in prodotti %}
        <div class="qr-card">
            <h3>{{ p.nome }}</h3>
            <p><strong>SAP:</strong> {{ p.sap or '-' }}</p>
            <!-- Esempio di visualizzazione del QR Code (o immagine/codice) -->
            <p><code>{{ p.qr_code }}</code></p>
            <p><small>Pos: {{ p.posizione or '-' }}</small></p>
        </div>
        {% else %}
        <p>Nessun articolo selezionato o trovato per la stampa.</p>
        {% endfor %}
    </div>

</body>
</html>
