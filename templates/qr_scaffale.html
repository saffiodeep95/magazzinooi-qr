<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stampa Scaffale {{ ubicazione }} - Gestionale OMG</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: white !important;
                -webkit-print-color-adjust: exact;
            }
            .card {
                border: none !important;
                box-shadow: none !important;
            }
        }
        .qr-box {
            border: 1px dashed #ccc;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #fff;
            page-break-inside: avoid;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Barra superiore (nascosta in stampa) -->
    <div class="container my-3 no-print">
        <div class="d-flex justify-content-between align-items-center">
            <a href="javascript:history.back()" class="btn btn-secondary btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Indietro
            </a>
            <h4 class="mb-0">Ubicazione: {{ ubicazione }}</h4>
            <button onclick="window.print()" class="btn btn-primary">
                <i class="fa-solid fa-print me-1"></i> Stampa QR
            </button>
        </div>
        <hr>
    </div>

    <div class="container">
        <!-- Intestazione visibile solo in stampa o come titolo principale -->
        <div class="text-center mb-4">
            <h2>Ubicazione Scaffale: <strong>{{ ubicazione }}</strong></h2>
        </div>

        {% if prodotti %}
            <div class="row">
                {% for p in prodotti %}
                <div class="col-md-4 col-sm-6 mb-3">
                    <div class="qr-box">
                        <h5 class="text-primary mb-2">{{ p.posizione }}</h5>
                        <!-- QR Code generato tramite API online (es. qrcode.tec-it.com) -->
                        <div class="my-2">
                            <img src="https://barcode.tec-it.com/Barcode.ashx?data={{ p.qr_code }}&code=QRCode&imagetype=Png&dpi=150" alt="QR {{ p.qr_code }}" style="max-width: 140px; height: auto;">
                        </div>
                        <span class="badge bg-dark">{{ p.qr_code }}</span>
                    </div>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="alert alert-warning text-center" role="alert">
                Nessun articolo trovato in questa ubicazione.
            </div>
        {% endif %}
    </div>

    <!-- Bootstrap 5 JS e FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
