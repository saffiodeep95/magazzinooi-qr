<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carico Merce (+1) / Inserimento</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background-color: #eef2f5; }
        .box { background: white; display: inline-block; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 90%; width: 440px; }
        input[type="text"], input[type="email"] { width: 90%; padding: 12px; font-size: 15px; border: 2px solid #28a745; border-radius: 5px; text-align: center; margin-top: 10px; }
        .log { margin-top: 20px; padding: 15px; border-radius: 5px; font-size: 15px; font-weight: bold; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .new-form { background: #f8f9fa; padding: 15px; border: 1px solid #ddd; border-radius: 5px; margin-top: 15px; text-align: left; }
        .btn-save { padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; width: 100%; margin-top: 12px; cursor: pointer; font-size: 15px; }
        .btn-back { display: inline-block; margin-bottom: 20px; color: #555; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <a href="/" class="btn-back">← Torna alle Giacenze</a>
        <h2 style="color: #28a745;">+ Carico Merce / Aggiungi QR</h2>
        <p>Inquadra il QR Code con la pistola per caricare (+1):</p>
        
        <form id="scanForm">
            <input type="text" id="qrInput" placeholder="Spara sul QR code..." autofocus autocomplete="off">
        </form>

        <div id="statusLog" class="log" style="display: none;"></div>

        <!-- Form comparsa in caso di NUOVO Prodotto -->
        <div id="newProductBox" class="new-form" style="display: none;">
            <h3 style="margin-top: 0;">Nuovo Prodotto Rilevato!</h3>
            <p>Codice QR: <strong id="lblQr"></strong></p>
            <input type="hidden" id="hiddenQr">
            
            <label><strong>Nome Prodotto:</strong></label>
            <input type="text" id="nomeInput" placeholder="Es: Cavo HDMI 2m" style="border-color: #ccc; text-align: left;">
            
            <label style="margin-top: 8px; display: block;"><strong>Posizione / Scaffale:</strong></label>
            <input type="text" id="posInput" placeholder="Es: Scaffale A1" style="border-color: #ccc; text-align: left;">
            
            <label style="margin-top: 8px; display: block;"><strong>Email per Invio Etichetta (Opzionale):</strong></label>
            <input type="email" id="emailInput" placeholder="es: stampa@azienda.com" style="border-color: #ccc; text-align: left;">
            
            <button class="btn-save" onclick="salvaNuovoProdotto()">Salva e Spedisci Etichetta</button>
        </div>
    </div>

    <script>
        const qrInput = document.getElementById('qrInput');
        const statusLog = document.getElementById('statusLog');
        const scanForm = document.getElementById('scanForm');
        const newProductBox = document.getElementById('newProductBox');

        document.addEventListener('click', (e) => {
            if (!newProductBox.contains(e.target)) qrInput.focus();
        });

        scanForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const code = qrInput.value.trim();
            if (!code) return;

            fetch('/api/carica', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qr_code: code })
            })
            .then(res => res.json())
            .then(data => {
                statusLog.style.display = 'block';
                if (data.success) {
                    newProductBox.style.display = 'none';
                    statusLog.className = 'log success';
                    statusLog.innerText = data.message;
                    qrInput.value = '';
                    qrInput.focus();
                } else if (data.is_new) {
                    statusLog.className = 'log error';
                    statusLog.innerText = data.message;
                    document.getElementById('lblQr').innerText = code;
                    document.getElementById('hiddenQr').value = code;
                    newProductBox.style.display = 'block';
                    document.getElementById('nomeInput').focus();
                }
            });
        });

        function salvaNuovoProdotto() {
            const code = document.getElementById('hiddenQr').value;
            const nome = document.getElementById('nomeInput').value.trim();
            const pos = document.getElementById('posInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();

            if (!nome) { alert("Inserisci il nome del prodotto!"); return; }

            fetch('/api/carica', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qr_code: code, nome: nome, posizione: pos, email: email })
            })
            .then(res => res.json())
            .then(data => {
                newProductBox.style.display = 'none';
                statusLog.style.display = 'block';
                statusLog.className = 'log success';
                statusLog.innerText = data.message;
                document.getElementById('nomeInput').value = '';
                document.getElementById('posInput').value = '';
                document.getElementById('emailInput').value = '';
                qrInput.value = '';
                qrInput.focus();
            });
        }
    </script>
</body>
</html>
